<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#C98822"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Badge -->
  <rect width="100" height="100" rx="24" fill="#091C17"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#gold)" stroke-width="2.5" fill="none"/>

  <!-- Left Dumbbell -->
  <circle cx="24" cy="28" r="9" fill="url(#gold)"/>
  <circle cx="24" cy="28" r="6" fill="#091C17"/>
  <circle cx="24" cy="28" r="3" fill="url(#gold)"/>
  <rect x="30" y="26" width="6" height="4" rx="1" fill="url(#gold)"/>

  <!-- Right Dumbbell -->
  <circle cx="76" cy="28" r="9" fill="url(#gold)"/>
  <circle cx="76" cy="28" r="6" fill="#091C17"/>
  <circle cx="76" cy="28" r="3" fill="url(#gold)"/>
  <rect x="64" y="26" width="6" height="4" rx="1" fill="url(#gold)"/>

  <!-- Bodybuilder Silhouette Head & Traps -->
  <circle cx="50" cy="28" r="6" fill="url(#gold)"/>
  
  <!-- Arms & Traps -->
  <path d="M44 32 C41 31 36 34 34 40 C32 46 35 50 39 48 C42 46 44 41 46 37 Z" fill="url(#gold)"/>
  <path d="M56 32 C59 31 64 34 66 40 C68 46 65 50 61 48 C58 46 56 41 54 37 Z" fill="url(#gold)"/>
  
  <!-- Massive Muscular Back (V-Taper) -->
  <path d="M42 37 C40 41 34 46 33 54 C31 62 37 68 42 70 L50 72 L58 70 C63 68 69 62 67 54 C66 46 60 41 58 37 Z" fill="url(#gold)"/>

  <!-- Signature 4-Point Stars on Back -->
  <path d="M50 42 Q50 46 53 46 Q50 46 50 50 Q50 46 47 46 Q50 46 50 42 Z" fill="#091C17"/>
  <path d="M50 53 Q50 58 54 58 Q50 58 50 63 Q50 58 46 58 Q50 58 50 53 Z" fill="#091C17"/>

  <!-- "THE GYM" Waist Banner -->
  <rect x="38" y="70" width="24" height="6" rx="2" fill="url(#gold)"/>
  <text x="50" y="75" text-anchor="middle" fill="#091C17" font-size="4" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="0.5">THE GYM</text>

  <!-- Stars Below -->
  <polygon points="50,81 51.5,85 55.5,85 52.5,87.5 53.5,91.5 50,89 46.5,91.5 47.5,87.5 44.5,85 48.5,85" fill="url(#gold)"/>
  <polygon points="40,84 41,86 43,86 41.5,87 42,89 40,88 38,89 38.5,87 37,86 39,86" fill="url(#gold)"/>
  <polygon points="60,84 61,86 63,86 61.5,87 62,89 60,88 58,89 58.5,87 57,86 59,86" fill="url(#gold)"/>

  <!-- Laurel Wreaths -->
  <path d="M28 85 C24 85 20 82 18 78" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M72 85 C76 85 80 82 82 78" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
</svg>
